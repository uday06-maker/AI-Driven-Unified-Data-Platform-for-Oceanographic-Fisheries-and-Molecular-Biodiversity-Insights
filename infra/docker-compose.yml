version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://samudra_admin:secure_samudra_pass@postgres:5432/samudra_marine_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb-ha:pg16-postgis3.4
    container_name: samudra_timescale_postgis
    environment:
      POSTGRES_DB: samudra_marine_db
      POSTGRES_USER: samudra_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_samudra_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: samudra_redis_queue
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: samudra_object_store
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: samudra_minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
